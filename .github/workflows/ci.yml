name: CI

# 跨平台基础校验：类型检查、Lint、单元测试、前端生产构建、Rust 编译检查。
# Windows 专属测试（windows_rejects_custom_command）在 build-windows.yml 中执行。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Linux runner 默认没有 Tauri 桌面端的系统依赖，缺 glib-2.0 会导致 cargo check 失败。
      # 本仓库的发布平台是 Windows / Android，这里只是 Linux 上的编译冒烟检查。
      - name: Install Linux dependencies (Tauri desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Next.js production build
        run: pnpm build

      - name: Cargo check (desktop / Android config)
        working-directory: src-tauri
        run: cargo check
